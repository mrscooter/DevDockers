services:
  dev-env:
    build:
      context: .
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    image: ${IMAGE_NAME:-fullstack-web-dev-env}
    container_name: ${CONTAINER_NAME:-fullstack-web-dev}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    group_add:
      - "${DOCKER_GID}"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - DEV_NAME=${DEV_NAME}
      - DEV_EMAIL=${DEV_EMAIL}
      # Shared Postgres CONNECTION params only (must match the ../shared-db project).
      # Deliberately no PGDATABASE: the database is never ambient, so nothing connects
      # to a shared default by accident - pick it explicitly (psql -d, or app config).
      - PGHOST=localhost
      - PGPORT=${PG_HOST_PORT:-5433}
      - PGUSER=${POSTGRES_USER:-admin}
      - PGPASSWORD=${POSTGRES_PASSWORD:-devPass77}
      # Base URL for the default DB - NOT named DATABASE_URL so it can't auto-wire or
      # shadow a worktree's own .env. A template to derive your per-worktree URL from.
      - BASE_DEV_DB_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-devPass77}@localhost:${PG_HOST_PORT:-5433}/${POSTGRES_DB:-devdocker_default_db}
      # Claude bootstrap (see entrypoint.sh). Clones the public utils repo into the
      # home volume and wires skills + a Mercury-free global CLAUDE.md. The Claude
      # LOGIN is shared separately via the .credentials.json bind-mount below.
      - CLAUDE_BOOTSTRAP=${CLAUDE_BOOTSTRAP:-true}
      - CLAUDE_BOOTSTRAP_FORCE=${CLAUDE_BOOTSTRAP_FORCE:-false}
      - CLAUDE_UTILS_REPO=${CLAUDE_UTILS_REPO:-https://github.com/mrscooter/nicnajder-general-utils.git}
      - CLAUDE_UTILS_DIR=${CLAUDE_UTILS_DIR:-/home/devuser/Tools/nicnajder-general-utils}
    shm_size: 256m
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /var/run/docker.sock:/var/run/docker.sock
      - devuser-home:/home/devuser
      # Seed for the host's Claude login, mounted READ-ONLY at a staging path and
      # COPIED into ~/.claude by entrypoint.sh on every container start. It must be a
      # copy, not a mount at the real path: Claude Code replaces the file via rename
      # on every token refresh, and a single-file bind mount pins the inode - the
      # host-side rename leaves the mount stale (401s once the old token expires),
      # and the container-side rename fails (cannot rename over a mountpoint). With
      # a local copy the container refreshes its own login independently; restarting
      # the container re-seeds it from the host's then-current login. The host file
      # must already exist, i.e. you have logged into Claude on the host at least once.
      - ${HOST_CLAUDE_DIR:-${HOME}/.claude}/.credentials.json:/run/host-claude-credentials.json:ro
      # Host->container file bridge. Drop SSH keys you want to use INSIDE the
      # container here, then run `import-ssh-keys-from-fastshare <name>` (see README
      # "SSH keys"). Nothing here is auto-trusted; company keys stay out unless you
      # deliberately put them in. FASTSHARE_PATH is required (no default).
      - ${FASTSHARE_PATH:?set FASTSHARE_PATH in .env - absolute host dir for the ~/fast_share bridge, see .env.example}:/home/devuser/fast_share
    # Host networking: the container shares the host's network stack, so any dev
    # server you launch (Django, Vite, ...) is reachable on the host at the same
    # port with no mapping, and the shared Postgres is reached at
    # localhost:${PG_HOST_PORT}. Run several worktrees at once by giving each
    # worktree's dev servers distinct ports.
    network_mode: host

volumes:
  devuser-home:
