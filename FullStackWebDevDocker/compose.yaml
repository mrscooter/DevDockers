services:
  dev-env:
    build:
      context: .
      # Files shared by the dev dockers' images (entrypoint.sh), see the Dockerfile.
      additional_contexts:
        shared: ../shared-scripts
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    image: ${IMAGE_NAME:-fullstack-web-dev-env}
    container_name: ${CONTAINER_NAME:-fullstack-web-dev}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    # tini as PID 1: forwards SIGTERM (instant stops instead of a 10 s timeout + kill) and
    # reaps orphaned processes, e.g. GUI apps started with & from a since-closed shell.
    init: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PROMPT_PREFIX=${PROMPT_PREFIX:-}
      - DEV_NAME=${DEV_NAME:?set DEV_NAME in .env - your git identity, see .env.example}
      - DEV_EMAIL=${DEV_EMAIL:?set DEV_EMAIL in .env - your git identity, see .env.example}
      - SSH_AUTH_SOCK=/run/host-ssh-agent/agent.sock
      # Shared Postgres CONNECTION params only (must match the ../shared-db project).
      # Deliberately no PGDATABASE: the database is never ambient, so nothing connects
      # to a shared default by accident - pick it explicitly (psql -d, or app config).
      - PGHOST=localhost
      - PGPORT=${PG_HOST_PORT:-5433}
      - PGUSER=${POSTGRES_USER:-admin}
      - PGPASSWORD=${POSTGRES_PASSWORD:-devPass77}
      # Base URL for the default DB - NOT named DATABASE_URL so it can't auto-wire or
      # shadow a worktree's own .env. A template to derive your per-worktree URL from.
      - BASE_DEV_DB_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-devPass77}@localhost:${PG_HOST_PORT:-5433}/${POSTGRES_DB:-devdocker_default_db}
    shm_size: 256m
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - devuser-home:/home/devuser
      # Socket dir of this container's host-side ssh-agent, started by
      # zsh-into-docker-container.sh. The whole dir is mounted, not the socket, so a
      # restarted agent's new socket shows up.
      - ${HOME}/.local/state/${CONTAINER_NAME:-fullstack-web-dev}-ssh:/run/host-ssh-agent
      # Host->container file bridge. FASTSHARE_PATH is required (no default).
      - ${FASTSHARE_PATH:?set FASTSHARE_PATH in .env - host dir for the ~/fast_share bridge, see .env.example}:/home/devuser/fast_share
    # Host networking: the container shares the host's network stack, so any dev
    # server you launch (Django, Vite, ...) is reachable on the host at the same
    # port with no mapping, and the shared Postgres is reached at
    # localhost:${PG_HOST_PORT}. Run several worktrees at once by giving each
    # worktree's dev servers distinct ports.
    network_mode: host

volumes:
  devuser-home:
