# Overlay that bind-mounts a host project checkout into the container at
# /home/devuser/code/project-external (read/write).
#
# This file is NOT loaded by default. To enable, uncomment the COMPOSE_FILE
# line in .env (so docker compose loads both compose.yaml AND this overlay):
#
#   COMPOSE_FILE=compose.yaml:compose.external-mount.yaml
#
# HOST_CODE_PATH must point at your project checkout on the host.
# When disabled, you work with a checkout cloned INSIDE the container at
# ~/code/<project> (lives in the named volume, invisible to host).

services:
  dev-env:
    volumes:
      - ${HOST_CODE_PATH}:/home/devuser/code/project-external
