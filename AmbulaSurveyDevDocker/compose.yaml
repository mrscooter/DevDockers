services:
  dev-env:
    build:
      context: .
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    image: ${IMAGE_NAME:-ambula-dev-env}
    container_name: ${CONTAINER_NAME:-ambula-dev-container}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    group_add:
      - "${DOCKER_GID}"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - DEV_NAME=${DEV_NAME}
      - DEV_EMAIL=${DEV_EMAIL}
    shm_size: 256m
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/home/devuser/.Xauthority:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ambula-dev-env-devuser-home:/home/devuser
    network_mode: host
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME:-ambula-dev-db}
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=devPass77
      - POSTGRES_DB=ambula_survey
    volumes:
      - ambula-pg-data:/var/lib/postgresql/data
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ambula_survey"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ambula-dev-env-devuser-home:
  ambula-pg-data:
